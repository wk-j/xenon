[package]
name = "xen"
version = "0.1.17"
edition = "2021"
rust-version = "1.88"
description = "Command-line client for a Xenon resource server"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
rpassword = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
axum = "0.8"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
xenon = { path = ".." }
