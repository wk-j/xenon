[workspace]
members = ["cli"]
resolver = "2"

[package]
name = "xenon"
version = "0.1.9"
edition = "2021"
rust-version = "1.88"
description = "Central resource server for Krypton-generated artifacts, reviews, analyses, docs and attention flags"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.35", features = ["bundled"] }
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.2"
data-encoding = "2"
comrak = { version = "0.49", default-features = false }
log = "0.4"
env_logger = "0.11"
askama = "0.16"

[dev-dependencies]
tempfile = "3"
data-encoding = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
